version: '3.8'

services:
  # ==========================================
  # 1. MongoDB Database Service
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: finapp-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=finapp
    volumes:
      - mongodb_data:/data/db
    networks:
      - finapp-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==========================================
  # 2. Node.js + Express Backend Service
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finapp-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/finapp
      - JWT_SECRET=super_secret_finapp_jwt_key_2026_finance_tracker
      - JWT_EXPIRE=7d
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - finapp-network

  # ==========================================
  # 3. React.js + Nginx Frontend Service
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=/api/v1
    container_name: finapp-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - finapp-network

# ==========================================
# Persistent Named Volumes
# ==========================================
volumes:
  mongodb_data:
    driver: local
  uploads_data:
    driver: local

# ==========================================
# Isolated Bridge Network
# ==========================================
networks:
  finapp-network:
    driver: bridge
