name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Verify the successful CI run is for the latest main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current_sha" = "$CI_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale CI run; main has moved to another commit."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.current.outputs.deploy == 'true'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/finapp_ec2
          chmod 600 ~/.ssh/finapp_ec2
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull and deploy on EC2
        if: steps.current.outputs.deploy == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -i ~/.ssh/finapp_ec2 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "CI_SHA='$CI_SHA' bash -se" <<'REMOTE'
          set -eu
          cd "$HOME/mern-devops-finapp"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$CI_SHA" ]; then
            echo "Skipping stale deployment; main has moved to another commit."
            exit 0
          fi
          if [ ! -f .env ]; then
            echo "Missing $HOME/mern-devops-finapp/.env; create it from .env.example before deploying." >&2
            exit 1
          fi
          git pull origin main
          docker compose --env-file .env down
          docker compose --env-file .env up --build -d --remove-orphans
          docker compose ps
          REMOTE
